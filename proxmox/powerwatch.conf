# PowerWatch config for the Proxmox VE host.
#
# Sourced as bash. Anything you'd export in a shell script works here.

# Mains-powered hosts to ping. Pick at least two devices NOT on the UPS.
PING_TARGETS="192.168.1.1 192.168.1.2"

SHUTDOWN_HOOK="/usr/local/sbin/powerwatch-shutdown-hook.sh"

CHECK_INTERVAL_SEC=5

# Be conservative on the Proxmox box — guests can take a while to flush.
# Total worst-case shutdown ≈ OUTAGE_THRESHOLD_SEC + GUEST_SHUTDOWN_TIMEOUT_SEC
# + a few seconds. Tune so this is comfortably under your UPS runtime.
OUTAGE_THRESHOLD_SEC=60

PING_TIMEOUT_SEC=2

# Seconds to wait per VM/CT for graceful ACPI shutdown before forceStop.
export GUEST_SHUTDOWN_TIMEOUT_SEC=120
