# PowerWatch config for the docker host.
#
# Sourced as bash. Anything you'd export in a shell script works here.

# Space-separated list of mains-powered hosts to ping. Pick at least two —
# if any one of them answers, power is considered on. Avoid putting anything
# here that shares the same UPS as this box.
#   examples: the household router, an always-on Raspberry Pi on the wall,
#             a smart plug with a known IP, the ISP gateway.
PING_TARGETS="192.168.1.1 192.168.1.2"

# Path to the per-host shutdown script. Installed by install.sh.
SHUTDOWN_HOOK="/usr/local/sbin/powerwatch-shutdown-hook.sh"

# How often (seconds) to ping.
CHECK_INTERVAL_SEC=5

# How long (seconds) all targets must be unreachable before we shut down.
# Set to longer than your longest realistic network blip but shorter than
# the UPS runtime minus the time the shutdown itself needs.
OUTAGE_THRESHOLD_SEC=60

# Per-ping timeout (seconds) passed to `ping -W`.
PING_TIMEOUT_SEC=2

# Per-container SIGTERM grace passed to `docker stop -t`.
export STOP_TIMEOUT_SEC=30
