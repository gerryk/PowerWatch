# PowerWatch config for the TrueNAS SCALE host.
#
# Sourced as bash. Anything you'd export in a shell script works here.

# Mains-powered hosts to ping. Pick at least two devices NOT on the UPS.
PING_TARGETS="192.168.1.1 192.168.1.2"

SHUTDOWN_HOOK="/usr/local/sbin/powerwatch-shutdown-hook.sh"

CHECK_INTERVAL_SEC=5

# Reminder: total worst-case = OUTAGE_THRESHOLD_SEC + however long it takes
# TrueNAS to stop services and export pools (can be a minute or two on a
# busy NAS). Keep comfortably under the UPS runtime.
OUTAGE_THRESHOLD_SEC=60

PING_TIMEOUT_SEC=2

# How long to wait for `midclt call system.shutdown` before falling back.
export MIDCLT_TIMEOUT_SEC=300
